name: Daily KOSPI RS Monitor

on:
  schedule:
    - cron: '30 7 * * 1-5'   # 매일 16:30 KST (장 마감 후)
  workflow_dispatch:

jobs:
  run-rs-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore RS cache
        uses: actions/cache@v4
        with:
          path: rs_cache_*.csv
          key: rs-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            rs-cache-${{ runner.os }}-

      - name: Run RS Monitor
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python rs_monitor.py

      - name: Upload RS report CSV
        uses: actions/upload-artifact@v4
        with:
          name: rs-report-${{ github.run_id }}
          path: rs_report_*.csv
          retention-days: 30

      - name: Keep repo alive
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          date > .keepalive
          git add .keepalive
          git diff --staged --quiet || git commit -m "chore: keep alive" && git push
